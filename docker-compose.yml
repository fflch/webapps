services:
  webapps:
    build: .
    image: webapps:latest
    container_name: webapps
    ports:
      - "8000:80"
    depends_on:
      - mariadb
    networks:
      - webapps-network
    volumes:
      - ./:/var/www/html
    environment:
      HOME: /tmp
    user: "${UID:-1000}:${GID:-1000}"

  mariadb:
    image: mariadb:11
    container_name: webapps_mariadb
    restart: always
    environment:
      MYSQL_DATABASE: webapps
      MYSQL_USER: webapps
      MYSQL_PASSWORD: webapps
      MYSQL_ROOT_PASSWORD: webapps
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - webapps-network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: webapps_phpmyadmin
    restart: always
    depends_on:
      - mariadb
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mariadb
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: webapps
    networks:
      - webapps-network

  postgres:
    image: postgres:16
    container_name: webapps_postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: postgres
    networks:
      - webapps-network
    ports:
      - "8432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: webapps_pgadmin
    restart: always
    depends_on:
      - postgres
    ports:
      - "8082:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    networks:
      - webapps-network

  selenium:
    image: selenium/standalone-chrome
    container_name: webapps_selenium
    ports:
      - "7900:7900"
    networks:
      - webapps-network
    shm_size: 2gb

  # No /etc/hosts do seu computador colocar a linha `127.0.0.1 auth.local`
  # particularidades do protocolo oAuth1 usado na USP
  senhaunica-faker:
    image: uspdev/senhaunica-faker
    container_name: webapps_senhaunica-faker
    ports:
      - "3141:3141"
    environment:
          - APP_URL=http://auth.local:3141
    networks:
      webapps-network:
        aliases:
          - auth.local

  mailpit:
    image: axllent/mailpit:latest
    container_name: webapps_mailpit
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Interface Web
    networks:
      - webapps-network

  gwdb:
    image: ghcr.io/fflch/gwdb:latest
    container_name: webapps_gwdb
    depends_on:
      - mariadb
    networks:
      - webapps-network
    environment:
      TOKEN: 123
      DB_HOST: mariadb
      DB_NAME: admin
      DB_USER: admin
      DB_PASS: admin
      DB_PORT: 3306

  garage:
    image: dxflrs/garage:v2.3.0
    container_name: webapps_garage
    restart: unless-stopped
    ports:
        - "3900:3900"
        - "3903:3903"
    volumes:
        - garage_data:/data
        - ./docker/garage/garage.toml:/etc/garage.toml:ro
    environment:
        - RUST_LOG=info
    networks:
      - webapps-network

  garage-webui:
    image: genebit/garage-webui:latest
    container_name: garage-webui
    restart: unless-stopped

    depends_on:
      - garage

    volumes:
      - ./garage.toml:/etc/garage.toml:ro

    environment:
      API_BASE_URL: "http://127.0.0.1:3903"
      S3_ENDPOINT_URL: "http://127.0.0.1:3900"

    ports:
      - "3909:3909"

networks:
  webapps-network:

volumes:
  mariadb_data:
  garage_data:
  pg_data:
